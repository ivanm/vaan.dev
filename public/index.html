    <script>
      // Theme before first paint: dark by default, light only when the viewer chose it.
      (function () {
        try {
          if (localStorage.getItem("vaan-theme") === "light") {
            document.documentElement.dataset.theme = "light";
            document.querySelector("meta[name=color-scheme]").content = "light";
            document.querySelector("meta[name=theme-color]").content = "#ECE8E1";
          }
        } catch (e) {}

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->

    <script>
      // The turntable poster is the home page's largest image: fetch it before the bundle runs.
      (function (p) {

        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "image";
        l.href = "%PUBLIC_URL%/media/turn/f000.webp";
        l.setAttribute("imagesrcset", "%PUBLIC_URL%/media/turn-s/f000.webp 600w, %PUBLIC_URL%/media/turn/f000.webp 840w");
        l.setAttribute("imagesizes", "(max-width: 860px) 200px, 600px");
        l.setAttribute("fetchpriority", "high");
        document.head.appendChild(l);
      })(window.location.pathname);
